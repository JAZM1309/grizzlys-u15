name: Grizzlys Ergebnisdienst

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  result-push:
    runs-on: ubuntu-latest

    steps:
      - name: Spielplan laden
        uses: actions/checkout@v4
        
      - name: Firebase Admin installieren
        run: npm install firebase-admin

      - name: Ergebnisse prüfen und Push senden
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cat > result-push.js <<'EOF' 
          const { cert, initializeApp } = require("firebase-admin/app");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");
          const { getMessaging } = require("firebase-admin/messaging");
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const gamesMatch = html.match(/const games=(\[[\s\S]*?\]);/);
          const games = gamesMatch ? JSON.parse(gamesMatch[1]) : [];
          function berlinDate(date, time) {
           const [y, m, d] = date.split("-").map(Number);
           const [hh, mm] = time.split(":").map(Number);

           const localAsUtc = Date.UTC(y, m - 1, d, hh, mm);
           let guess = localAsUtc;

          const fmt = new Intl.DateTimeFormat("en-US", {
           timeZone: "Europe/Berlin",
           year: "numeric",
           month: "2-digit",
           day: "2-digit",
           hour: "2-digit",
           minute: "2-digit",
           second: "2-digit",
           hourCycle: "h23"
          });

          for (let i = 0; i < 3; i++) {
          const p = Object.fromEntries(
          fmt.formatToParts(new Date(guess))
          .filter(x => x.type !== "literal")
          .map(x => [x.type, x.value])
          );

          const displayedAsUtc = Date.UTC(
          Number(p.year),
          Number(p.month) - 1,
          Number(p.day),
          Number(p.hour),
          Number(p.minute),
          Number(p.second)
          );

          guess += localAsUtc - displayedAsUtc;
          }

          return new Date(guess);
          }
          
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          const firebaseApp = initializeApp({
            credential: cert(serviceAccount)
          });

          const db = getFirestore(firebaseApp);
          const messaging = getMessaging(firebaseApp);          

          async function main() {
            const tokensSnap = await db.collection("pushTokens").get();
            const tokens = tokensSnap.docs
              .map(d => d.data().token)
              .filter(Boolean);

            if (!tokens.length) {
              console.log("Keine Push-Geräte registriert.");
              return;
            }

            const resultsSnap = await db.collection("results").get();
            const now = Date.now();

            for (const resultDoc of resultsSnap.docs) {
              const r = resultDoc.data();

              if (!r.updatedAt) continue;
              if (r.pushSentAt) continue;

              const updated = r.updatedAt.toMillis();
              const age = now - updated;

              if (age < 0 || age > 10 * 60 * 1000) continue;

              const title = "🏒 ESV Grizzlys U15";
              const body =
                `Ergebnis: ${r.home} ${r.homeScore}:${r.awayScore} ${r.away}`;

              for (let i = 0; i < tokens.length; i += 500) {
                const batch = tokens.slice(i, i + 500);

                await messaging.sendEachForMulticast({
                  tokens: batch,
                  notification: {
                    title,
                    body
                  }
                });
              }

              await resultDoc.ref.update({
                pushSentAt: FieldValue.serverTimestamp()
              });

              console.log("Push gesendet:", resultDoc.id);
            }
          }

          main()
            .then(() => process.exit(0))
            .catch(error => {
              console.error(error);
              process.exit(1);
            });
          EOF

          node result-push.js
