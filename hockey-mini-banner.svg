<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04172b"/><stop offset=".48" stop-color="#0a3961"/><stop offset="1" stop-color="#071a31"/></linearGradient>
 <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9f8ff" stop-opacity=".34"/><stop offset="1" stop-color="#8ed8ff" stop-opacity=".04"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <clipPath id="puck"><circle cx="158" cy="292" r="67"/></clipPath>
 <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1200" height="400" rx="30" fill="url(#bg)"/>
<ellipse cx="120" cy="95" rx="210" ry="95" fill="url(#light)" opacity=".34"/>
<ellipse cx="550" cy="55" rx="260" ry="70" fill="url(#light)" opacity=".22"/>
<g opacity=".24" fill="none" stroke="#fff">
 <path d="M-100 260 Q250 120 590 280 T1320 180" stroke-width="3"/>
 <path d="M-120 300 Q250 160 600 305 T1320 220" stroke="#ff8a00" stroke-width="7"/>
 <ellipse cx="615" cy="405" rx="390" ry="165" stroke-width="3"/>
 <path d="M615 205V430" stroke-width="3"/>
 <circle cx="615" cy="355" r="54" stroke-width="3"/>
</g>
<path d="M0 286 Q310 190 625 292 T1200 235 V400H0Z" fill="url(#ice)"/>
<!-- dynamic rink spray -->
<g fill="#fff" opacity=".55">
 <circle cx="55" cy="300" r="4"/><circle cx="72" cy="275" r="2"/><circle cx="90" cy="320" r="3"/><circle cx="105" cy="288" r="2"/><circle cx="122" cy="335" r="4"/>
</g>
<!-- hockey stick -->
<g transform="translate(235 275) rotate(-54)">
 <path d="M0 0 L10 -210 Q12 -225 28 -223 L40 -220 Q48 -216 45 -202 L32 -18 Q30 4 18 18Z" fill="#1d2731" stroke="#d7e0e7" stroke-width="4"/>
 <path d="M-4 0 Q24 -12 70 4 L150 32 Q168 38 174 53 L171 66 Q167 77 151 73 L66 44 Q28 31 -5 28Z" fill="#252f38" stroke="#c4d0d8" stroke-width="4"/>
 <path d="M5 -150 L35 -148" stroke="#ff8a00" stroke-width="8"/>
</g>
<!-- puck -->
<ellipse cx="158" cy="310" rx="78" ry="24" fill="#000" opacity=".35" filter="url(#blur)"/>
<ellipse cx="158" cy="292" rx="74" ry="25" fill="#0b1118" stroke="#aab7c1" stroke-width="3"/>
<circle cx="158" cy="292" r="58" fill="#111a23" stroke="#344451" stroke-width="2"/>
<image href="logo.png" x="100" y="234" width="116" height="116" preserveAspectRatio="xMidYMid meet" opacity=".85" clip-path="url(#puck)"/>
<ellipse cx="158" cy="292" rx="53" ry="18" fill="none" stroke="#ff8a00" stroke-opacity=".45" stroke-width="2"/>
<!-- actual Grizzlys logo in the background -->
<g opacity=".30">
 <circle cx="1015" cy="195" r="175" fill="#071b33" opacity=".32"/>
 <image href="logo.png" x="845" y="25" width="340" height="340" preserveAspectRatio="xMidYMid meet"/>
</g>
<path d="M760 38 Q900 105 1035 45" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="24"/>
<g fill="#ff8a00" opacity=".75"><circle cx="820" cy="320" r="3"/><circle cx="850" cy="300" r="2"/><circle cx="1120" cy="280" r="3"/></g>
</svg>