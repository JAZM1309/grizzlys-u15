<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grizzlys U15 – Analytics-Test</title>
</head>
<body style="font-family:system-ui;padding:24px">
<h1>🏒 Grizzlys U15 – Analytics-Test</h1>
<p>Diese Seite testet ausschließlich Google Analytics. Die eigentliche App wird dabei nicht verändert.</p>
<p id="status">Analytics wird geladen …</p>
<button id="test" type="button" style="padding:12px 18px;font-size:16px">Analytics-Testereignis senden</button>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAnalytics, logEvent, isSupported } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-analytics.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-Dqjj-vNMYA8QRc3SGeivMDRjEHjwKe0",
  authDomain: "grizzlys-u15.firebaseapp.com",
  projectId: "grizzlys-u15",
  storageBucket: "grizzlys-u15.firebasestorage.app",
  messagingSenderId: "595868074479",
  appId: "1:595868074479:web:2ac44da77d0dc533ac361a",
  measurementId: "G-WJ539PL04L"
};

const app = initializeApp(firebaseConfig);
const status = document.getElementById("status");
try {
  if (await isSupported()) {
    const analytics = getAnalytics(app);
    logEvent(analytics, "analytics_test_page_opened");
    status.textContent = "✅ Analytics ist verfügbar. Öffne jetzt Google Analytics → Echtzeit.";
    document.getElementById("test").onclick = () => {
      logEvent(analytics, "analytics_test_button");
      status.textContent = "✅ Testereignis gesendet.";
    };
  } else {
    status.textContent = "❌ Analytics wird von diesem Browser nicht unterstützt.";
  }
} catch (e) {
  console.error(e);
  status.textContent = "❌ Analytics konnte nicht gestartet werden. Details stehen in der Browser-Konsole.";
}
</script>
</body>
</html>
